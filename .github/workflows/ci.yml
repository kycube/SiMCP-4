name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the plugin and the inner bridge (x86)
        shell: cmd
        run: bridge\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: simcp4-dlls
          path: bridge/build/*.dll
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the release (wheel with the DLLs, zip)
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: simcp4-release
          path: dist/*
